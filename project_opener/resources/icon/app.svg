<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Project Opener 3 - flat mark (docs/DESIGN.md): aurora-green squircle,
       a white folder, and one arrow that leaves it: green inside the folder,
       white once it is out on the ground. No gradient, no glow, no clip paths
       (Qt's SVG renderer does not support them). -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="#0E7C5B"/>

  <!-- folder: back with tab, then the body -->
  <path d="M80 194 a26 26 0 0 1 26 -26 h82 l30 -24 h98 a26 26 0 0 1 26 24 v20 H80 z" fill="#DDF3EA"/>
  <rect x="80" y="212" width="262" height="188" rx="26" fill="#FFFFFF"/>
  <!-- the flap, slightly lifted (a lighter plate hinged on the bottom) -->
  <path d="M96 252 h230 a18 18 0 0 1 17 23 l-28 104 a22 22 0 0 1 -21 16 H128 a22 22 0 0 1 -21 -16 L79 275 a18 18 0 0 1 17 -23 z"
        fill="#F5F8F6"/>

  <!-- one arrow: the shaft starts inside the folder (green), leaves it (white) -->
  <g fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 326 H330" stroke="#0E7C5B"/>
    <path d="M330 326 H420" stroke="#FFFFFF"/>
    <path d="M372 278 l48 48 l-48 48" stroke="#FFFFFF"/>
  </g>
</svg>
